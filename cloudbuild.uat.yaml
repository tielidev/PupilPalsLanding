steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - -t
  - ${_IMAGE}
  - .

- name: gcr.io/cloud-builders/docker
  args:
  - push
  - ${_IMAGE}

- name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
  - run
  - deploy
  - ${_SERVICE}
  - --image=${_IMAGE}
  - --region=${_REGION}
  - --platform=managed
  - --allow-unauthenticated

images:
- ${_IMAGE}

substitutions:
  _REGION: asia-east1
  _SERVICE: pupil-pals-uat
  _IMAGE: asia-east1-docker.pkg.dev/$PROJECT_ID/pupil-pals/pupil-pals-uat:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
